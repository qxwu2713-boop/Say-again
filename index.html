<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>再讲一遍</title>
  <style>
    :root{--paper:#faf7f2;--ink:#3a322e;--muted:#9b8e86;--line:#eadfd6;--orange:#d88662;--pink:#c9827c;--shadow:0 13px 30px rgba(80,54,42,.11)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0eeea;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    .phone{width:414px;height:868px;padding:12px;border-radius:45px;background:#e0dfdd;box-shadow:0 30px 65px rgba(35,28,24,.19);position:relative}.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:112px;height:25px;border-radius:20px;background:#c9c8c7;z-index:5}.screen{height:100%;border-radius:35px;overflow:hidden;position:relative;background:var(--paper);border:1px solid #d2d0ce}.screen:before{content:"";position:absolute;inset:0;opacity:.34;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.025'/%3E%3C/svg%3E")}
    #app{height:100%;position:relative}.view{height:100%;padding:61px 20px 88px;overflow-y:auto;position:relative;z-index:1;animation:enter .32s ease}.view::-webkit-scrollbar{display:none}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--orange);font-weight:600}.title{font-family:Georgia,"Songti SC",serif;font-size:29px;letter-spacing:1px;margin:8px 0 4px}.sub{font-size:13px;color:var(--muted);margin:0}.home{display:flex;flex-direction:column;min-height:100%}.home-top{padding-left:5px}.echo-area{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}.quote-card{background:#fffdf9;border:1px solid rgba(227,212,201,.7);box-shadow:var(--shadow);border-radius:25px;width:100%;padding:30px 25px 18px;animation:pop .5s cubic-bezier(.2,.9,.3,1.1)}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}.quote-mark{font:54px Georgia;color:#ddb29b;height:30px;line-height:1}.quote-text{font-family:Georgia,"Songti SC",serif;font-size:24px;line-height:1.72;letter-spacing:.5px;margin:8px 0 22px}.quote-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.quote-thumb{width:42px;height:42px;object-fit:cover;border-radius:11px;margin-top:14px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:14px;height:48px;padding:0 17px;background:#fffaf4;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit}.btn.primary{color:#fff;background:var(--orange);box-shadow:0 7px 16px rgba(216,134,98,.25)}.home-actions{display:grid;grid-template-columns:1fr 1fr;padding:0 5px}.home-actions .btn{border-radius:15px;font-size:13px}.home-actions .primary{border-top-left-radius:0;border-bottom-left-radius:0}.home-actions .soft{background:#f0e4da;border-top-right-radius:0;border-bottom-right-radius:0}.empty{text-align:center;color:var(--muted);font-size:15px;line-height:1.9;padding:0 25px}.empty .btn{margin-top:15px}.tabbar{position:absolute;bottom:0;left:0;right:0;height:74px;background:rgba(255,253,249,.9);border-top:1px solid rgba(232,220,210,.7);z-index:3;display:flex;justify-content:space-around;padding:10px 23px 8px;backdrop-filter:blur(10px)}.tab{border:0;background:none;color:#a69a92;font:12px inherit;display:flex;align-items:center;gap:4px;flex-direction:column;cursor:pointer;padding:0 11px}.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}.tab.active{color:var(--orange)}.tab.active:after{content:"";height:3px;width:3px;background:currentColor;border-radius:50%;margin-top:-1px}
    .record-title{margin-bottom:25px}.textarea{width:100%;height:216px;resize:none;border:0;outline:0;border-radius:22px;background:#fffdf9;padding:20px;font:17px/1.75 inherit;color:var(--ink);box-shadow:0 6px 20px rgba(80,54,42,.045)}.textarea::placeholder{color:#c6b9b0}.modes{display:flex;gap:9px;margin:14px 0 17px}.mode{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 14px;border-radius:100px;font:13px inherit;cursor:pointer}.mode.active{border-color:#d89e82;background:#fff3ec;color:#bd704e}.image-add{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#a57361;font:14px inherit;padding:5px 1px;cursor:pointer}.image-add span{font-size:23px;font-weight:200}.preview{position:relative;margin-top:12px;width:92px;height:76px}.preview img{width:100%;height:100%;object-fit:cover;border-radius:12px}.remove-img{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border:0;border-radius:50%;background:#786960;color:white;cursor:pointer}.record-footer{position:absolute;left:20px;right:20px;bottom:95px}.tip{font-size:11px;line-height:1.6;color:#b5a79f;text-align:center;margin:0 5px 13px}.save{width:100%}.mark-intro{background:#f4eae2;padding:15px 16px;border-radius:17px;font-size:14px;line-height:1.65;color:#796961;margin-bottom:17px}.sentence{width:100%;text-align:left;border:1px solid transparent;background:#fffdf9;border-radius:16px;padding:14px 15px;margin:8px 0;color:var(--ink);font:15px/1.65 inherit;cursor:pointer;transition:.2s}.sentence.selected{border-color:#d38a6c;background:#fff5ef;box-shadow:inset 4px 0 0 var(--orange)}
    .list-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.list-title .title{margin:0}.count{font-size:12px;color:var(--muted)}.note{background:#fffdf9;border-radius:19px;padding:15px;margin:10px 0;border:1px solid rgba(235,224,214,.72);cursor:pointer;display:flex;gap:13px;min-height:104px}.note-text{flex:1;min-width:0}.note-date{font-size:11px;color:#a6948a;margin-bottom:8px}.note-body{font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.note-gold{border-left:3px solid var(--pink);padding-left:8px;margin-top:7px;font-size:11px;color:#a06d68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-img{width:68px;height:68px;border-radius:13px;object-fit:cover;flex:none}.back{border:0;background:transparent;color:#987767;font:14px inherit;padding:0;margin-bottom:18px;cursor:pointer}.detail-title{font:26px Georgia,"Songti SC",serif;margin:1px 0 6px}.detail-date{font-size:12px;color:var(--muted);margin-bottom:22px}.detail-image{width:100%;height:175px;object-fit:cover;border-radius:20px;margin-bottom:20px}.detail-content{white-space:pre-wrap;font-size:16px;line-height:1.95}.highlight-box{margin:22px 0;padding:17px;border-radius:18px;background:#f6e9df}.highlight-label{font-size:11px;color:#ae7663;margin-bottom:10px}.highlight-quote{font:16px/1.7 Georgia,"Songti SC",serif;margin:7px 0}.mood{font-size:12px;color:#a1938b;margin:24px 0}
    .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#4d403a;color:white;padding:11px 15px;border-radius:13px;font-size:12px;line-height:1.5;width:285px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:6}.toast.show{opacity:1;transform:translateX(-50%)}
    @media(max-width:600px){body{background:var(--paper)}.phone{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:transparent}.phone:before{display:none}.screen{border:0;border-radius:0}}
    /* Reference-inspired hand-drawn navigation and handwriting for saved words */
    .tabbar{height:78px;justify-content:center;gap:21px;padding:12px 22px 9px}
    .tab{width:62px;height:48px;justify-content:center;padding:0;border-radius:25px}
    .tab svg{width:28px;height:28px;stroke-width:1.5}
    .tab.active{background:#ecebe9;color:#2f2926}.tab.active:after{display:none}
    .home-actions{gap:10px}.home-actions .btn{border-radius:15px!important;background:#f0e4da!important;color:var(--ink)!important;box-shadow:none!important}
    .save{background:#f0e4da!important;color:var(--ink)!important;box-shadow:none!important}
    .textarea,.sentence,.quote-text,.note-body,.detail-content,.highlight-quote{font-family:"江西拙楷","Jiangxi Zhuokai","STKaiti","KaiTi","DFKai-SB",cursive}
    .textarea{font-size:19px}.sentence,.note-body,.detail-content{font-size:17px}
  </style>
</head>
<body>
<main class="phone"><div class="screen"><div id="app"></div><div id="toast" class="toast"></div></div></main>
<script>
const gradient = (a,b) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="390" cy="60" r="120" fill="white" opacity=".18"/><path d="M0 270 Q160 180 500 275 V350 H0Z" fill="white" opacity=".12"/></svg>`)}`;
const seed=[
 {id:1,date:'2026.09.08・周二晚',text:'下班时天已经黑了。路边的桂花香比白天更明显，好像所有没说出口的话，都在夜里有了形状。',quotes:['路边的桂花香比白天更明显，好像所有没说出口的话，都在夜里有了形状。']},
 {id:2,date:'2026.08.19・周三午后',text:'读到一句话：人不是慢慢变老的，是在某个下午突然发现，自己开始原谅很多事。原来成长不是变得坚硬，是允许世界偶尔失约。',quotes:['成长不是变得坚硬，是允许世界偶尔失约。'],image:gradient('#dfb7a2','#9eb6a5')},
 {id:3,date:'2026.07.02・周四凌晨',text:'耳机里循环着那首歌，窗外有很轻的雨。想起去年这个时候，原来那些以为不会过去的夜晚，也都安静地过去了。',quotes:['那些以为不会过去的夜晚，也都安静地过去了。']},
 {id:4,date:'2026.06.16・周二傍晚',text:'今天没有发生什么特别的事。只是晚饭后走了很久，风吹过来的时候，忽然觉得这样的普通也很好。',quotes:[]},
 {id:5,date:'2026.05.12・周二晚',text:'有些答案不需要现在就找到。日子会在你向前走的时候，替你把问题慢慢折好。',quotes:['日子会在你向前走的时候，替你把问题慢慢折好。'],image:gradient('#e7c2ae','#c9a3aa')},
 {id:6,date:'2026.04.25・周六早晨',text:'把被子晒在阳台上，看见楼下有人遛狗。阳光落在每个人身上，像一句没有说完的祝福。',quotes:[]},
 {id:7,date:'2026.03.07・周六夜',text:'翻到旧笔记本，发现当时写得那么郑重。幸好那个认真感受一切的自己，还在。',quotes:['幸好那个认真感受一切的自己，还在。']}
];
let notes=JSON.parse(localStorage.getItem('zjyb_notes')||'null')||seed; let tab='home',detail=null,record={text:'',image:null,stage:'write',quotes:[]};
const app=document.getElementById('app'); const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function save(){localStorage.setItem('zjyb_notes',JSON.stringify(notes))} function fmtNow(){let d=new Date(), w='日一二三四五六'[d.getDay()];return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}・周${w}${d.getHours()>17?'晚':d.getHours()<12?'早晨':'午后'}`}
function tabs(){return `<nav class="tabbar"><button class="tab ${tab==='home'?'active':''}" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今日回响</button><button class="tab ${tab==='record'?'active':''}" onclick="go('record')"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14.5a.5.5 0 0 1-.8.4L16 17.4l-3.3 2.5a1.1 1.1 0 0 1-1.4 0L8 17.4l-3.2 2.5a.5.5 0 0 1-.8-.4Z"/><path d="M8 8h8M8 11h6"/></svg>写下此刻</button><button class="tab ${tab==='notes'?'active':''}" onclick="go('notes')"><svg viewBox="0 0 24 24"><path d="M6 3.5h12A2.5 2.5 0 0 1 20.5 6v14.5l-4-2-4 2-4-2-4 2V6A2.5 2.5 0 0 1 6 3.5Z"/><path d="M8 8h8M8 12h8"/></svg>我的笔记</button></nav>`}
function quote(){let pool=notes.flatMap(n=>n.quotes.map(q=>({...n,q})));return pool[Math.floor(Math.random()*pool.length)]}
let current=quote();
function render(){let h=tab==='home'?home():tab==='record'?recordView():tab==='notes'?notesView():detailView();app.innerHTML=h+tabs()}
function home(){let p=notes.flatMap(n=>n.quotes.map(q=>({...n,q})));if(!p.length)return `<section class="view home"><div class="home-top"><div class="eyebrow">REPEAT IT AGAIN</div><h1 class="title">今日回响</h1><p class="sub">关于那天，让文字再讲一遍。</p></div><div class="echo-area"><div class="empty">还没有标记过想回顾的句子，<br>去记一句吧<br><button class="btn primary" onclick="go('record')">去写下此刻</button></div></div></section>`;let n=current;return `<section class="view home"><div class="home-top"><div class="eyebrow">REPEAT IT AGAIN</div><h1 class="title">今日回响</h1><p class="sub">关于那天，让文字再讲一遍。</p></div><div class="echo-area"><article class="quote-card"><div class="quote-mark">“</div><div class="quote-text">${esc(n.q)}</div><div class="quote-foot"><span>${n.date}</span><span>那天的你</span></div>${n.image?`<img class="quote-thumb" src="${n.image}"/>`:''}</article></div><div class="home-actions"><button class="btn soft" onclick="another()">再听一句</button><button class="btn primary" onclick="openDetail(${n.id})">回到那天</button></div></section>`}
function recordView(){if(record.stage==='mark'){let ss=split(record.text);return `<section class="view"><button class="back" onclick="record.stage='write';render()">← 继续编辑</button><div class="eyebrow">MARK FOR LATER</div><h1 class="title">哪些句子，想被再讲一遍？</h1><p class="mark-intro">轻点句子标记。它们会在未来某一天，自己回来找你。</p>${ss.map((s,i)=>`<button class="sentence ${record.quotes.includes(s)?'selected':''}" onclick="toggleQuote(${i})">${esc(s)}</button>`).join('')}<div class="record-footer"><button class="btn primary save" onclick="finishRecord()">完成</button></div></section>`}return `<section class="view"><div class="record-title"><div class="eyebrow">WRITE THIS MOMENT</div><h1 class="title">写下此刻</h1><p class="sub">不用完整，任何击中你的东西都可以。</p></div><textarea class="textarea" id="noteInput" oninput="record.text=this.value" placeholder="记下此刻击中你的任何东西……">${esc(record.text)}</textarea><div class="modes"><button class="mode active">文字</button><button class="mode" onclick="toast('Demo 版本暂用文字输入，正式版将支持截图识字')">截图</button><button class="mode" onclick="toast('Demo 版本暂用文字输入，正式版将支持语音转写')">语音</button></div><label class="image-add"><span>＋</span> 添加配图<input type="file" accept="image/*" hidden onchange="upload(this)"></label>${record.image?`<div class="preview"><img src="${record.image}"><button class="remove-img" onclick="record.image=null;render()">×</button></div>`:''}<div class="record-footer"><p class="tip">标记它，是为了某年某月某天，它能找你再讲一遍。</p><button class="btn primary save" onclick="startMark()">保存</button></div></section>`}
function notesView(){return `<section class="view"><div class="list-title"><div><div class="eyebrow">MY NOTES</div><h1 class="title">我的笔记</h1></div><span class="count">${notes.length} 条记录</span></div>${notes.map(n=>`<article class="note" onclick="openDetail(${n.id})"><div class="note-text"><div class="note-date">${n.date}</div><div class="note-body">${esc(n.text)}</div>${n.quotes.length?`<div class="note-gold">${esc(n.quotes[0])}</div>`:''}</div>${n.image?`<img class="note-img" src="${n.image}">`:''}</article>`).join('')}</section>`}
function detailView(){let n=notes.find(x=>x.id===detail);if(!n){go('notes');return''}return `<section class="view"><button class="back" onclick="go('notes')">← 我的笔记</button><div class="eyebrow">A NOTE FROM THEN</div><h1 class="detail-title">那天的心情</h1><div class="detail-date">${n.date}</div>${n.image?`<img class="detail-image" src="${n.image}">`:''}<div class="detail-content">${esc(n.text)}</div>${n.quotes.length?`<div class="highlight-box"><div class="highlight-label">你想留给未来的话</div>${n.quotes.map(q=>`<div class="highlight-quote">“${esc(q)}”</div>`).join('')}</div>`:''}<p class="mood">这是你在 ${n.date.replace('・','的')} 写下的心情。</p></section>`}
function go(x){tab=x;detail=null;render()}function another(){let p=notes.flatMap(n=>n.quotes.map(q=>({...n,q})));if(p.length>1){let nx;do{nx=quote()}while(nx.q===current.q);current=nx}render()}function openDetail(id){detail=id;tab='detail';render()}function split(t){return t.split(/(?<=[。！？!?\n])/).map(x=>x.trim()).filter(Boolean)}function startMark(){record.text=document.getElementById('noteInput').value.trim();if(!record.text){toast('先写下一点此刻的感受吧');return}record.stage='mark';render()}function toggleQuote(i){let s=split(record.text)[i],p=record.quotes.indexOf(s);p>=0?record.quotes.splice(p,1):record.quotes.push(s);render()}function finishRecord(){notes.unshift({id:Date.now(),date:fmtNow(),text:record.text,quotes:record.quotes,image:record.image});save();record={text:'',image:null,stage:'write',quotes:[]};tab='notes';render();toast('已经收进你的笔记本')}function upload(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{record.image=r.result;render()};r.readAsDataURL(f)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function tabs(){return `<nav class="tabbar"><button aria-label="今日回响" class="tab ${tab==='home'?'active':''}" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M12 20.5S4.2 16 4.2 9.5c0-2.45 1.55-4.15 3.75-4.15 1.75 0 3.12 1.07 4.05 2.62.93-1.55 2.3-2.62 4.05-2.62 2.2 0 3.75 1.7 3.75 4.15 0 6.5-7.8 11-7.8 11Z"/></svg></button><button aria-label="写下此刻" class="tab ${tab==='record'?'active':''}" onclick="go('record')"><svg viewBox="0 0 24 24"><path d="M6.2 3.7c3.1-.65 8.55-.65 11.6 0 .45.1.72.42.72.86v14.85c0 .52-.53.87-1.01.67-2.57-1.05-7.08-1.05-10.65 0-.48.2-1.01-.15-1.01-.67V4.56c0-.44.27-.76.72-.86Z"/><path d="M9 8c1.65-.26 3.85-.26 5.5 0M9 11.4c1.65-.26 3.85-.26 5.5 0M9 14.8c1.25-.2 2.9-.2 4.15 0"/></svg></button><button aria-label="我的笔记" class="tab ${tab==='notes'?'active':''}" onclick="go('notes')"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.25"/><path d="M5.3 20.2c.55-4.2 2.8-6.05 6.7-6.05s6.15 1.85 6.7 6.05M8.6 17.1c1.05.6 2.2.9 3.4.9s2.35-.3 3.4-.9"/></svg></button></nav>`}
function home(){let p=notes.flatMap(n=>n.quotes.map(q=>({...n,q})));let head=`<div class="home-top"><div class="eyebrow">SAY AGAIN</div><h1 class="title">今日回响</h1><p class="sub">关于那天，让文字再讲一遍。</p></div>`;if(!p.length)return `<section class="view home">${head}<div class="echo-area"><div class="empty">还没有标记过想回顾的句子，<br>去记一句吧<br><button class="btn primary" onclick="go('record')">去写下此刻</button></div></div></section>`;let n=current;return `<section class="view home">${head}<div class="echo-area"><article class="quote-card"><div class="quote-mark">“</div><div class="quote-text">${esc(n.q)}</div><div class="quote-foot"><span>${n.date}</span></div>${n.image?`<img class="quote-thumb" src="${n.image}"/>`:''}</article></div><div class="home-actions"><button class="btn soft" onclick="another()">再听一句</button><button class="btn soft" onclick="openDetail(${n.id})">回到那天</button></div></section>`}
function recordView(){if(record.stage==='mark'){let ss=split(record.text);return `<section class="view"><button class="back" onclick="record.stage='write';render()">← 继续编辑</button><div class="eyebrow">MARK FOR LATER</div><h1 class="title">哪些句子，想被再讲一遍？</h1><p class="mark-intro">轻点句子标记。它们会在未来某一天，自己回来找你。</p>${ss.map((s,i)=>`<button class="sentence ${record.quotes.includes(s)?'selected':''}" onclick="toggleQuote(${i})">${esc(s)}</button>`).join('')}<div class="record-footer"><button class="btn primary save" onclick="finishRecord()">完成</button></div></section>`}return `<section class="view"><div class="record-title"><div class="eyebrow">WRITE THIS MOMENT</div><h1 class="title">写下此刻</h1><p class="sub">不用完整，任何击中你的东西都可以。</p></div><textarea class="textarea" id="noteInput" oninput="record.text=this.value" placeholder="记下此刻击中你的任何东西……">${esc(record.text)}</textarea><div class="modes"><button class="mode active">文字</button><button class="mode" onclick="toast('Demo 版本暂用文字输入，正式版将支持截图识字')">截图</button><button class="mode" onclick="toast('Demo 版本暂用文字输入，正式版将支持语音转写')">语音</button></div><label class="image-add"><span>＋</span> 添加配图<input type="file" accept="image/*" hidden onchange="upload(this)"></label>${record.image?`<div class="preview"><img src="${record.image}"><button class="remove-img" onclick="record.image=null;render()">×</button></div>`:''}<div class="record-footer"><button class="btn primary save" onclick="startMark()">保存</button></div></section>`}
render();
</script></body></html>
